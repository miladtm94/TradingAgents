services:
  web-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - TRADING_CONSOLE_HOST=0.0.0.0
      - TRADING_CONSOLE_CORS_ORIGINS=http://localhost:4173,http://127.0.0.1:4173
    volumes:
      - research_console_data:/app/backend/data
    ports:
      - "127.0.0.1:8765:8000"
    restart: unless-stopped

  web-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - web-backend
    ports:
      - "127.0.0.1:4173:80"
    restart: unless-stopped

  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  research_console_data:
  tradingagents_data:
  ollama_data:
